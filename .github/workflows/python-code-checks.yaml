name: "[impit-python] Run code checks"

on:
  workflow_dispatch: null
  workflow_call:

permissions:
  contents: read

jobs:
  lint_check:
    name: Lint check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Disable automatic `uv` builds
        run: sed -i '/^\[tool\.uv\]$/a package = false' pyproject.toml
        working-directory: impit-python

      - name: Install Python dependencies
        run: uv sync --all-extras --frozen
        working-directory: impit-python

      - name: Run lint check
        run: uv run ruff format --diff --check && uv run ruff check --diff
        working-directory: impit-python

  type_check:
    name: Type check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Set up uv package manager
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "${{ matrix.python-version }}"

      - name: Disable automatic `uv` builds
        run: sed -i '/^\[tool\.uv\]$/a package = false' pyproject.toml
        working-directory: impit-python

      - name: Install Python dependencies
        run: uv sync --all-extras --frozen
        working-directory: impit-python

      - name: Run type check
        run: uv run mypy
        working-directory: impit-python
