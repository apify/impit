name: Check formatting
on:
  push:
    branches:
      - master
  pull_request:

env:
  RUSTFLAGS: "--cfg reqwest_unstable"

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: rustfmt

      - name: Rustfmt Check
        uses: actions-rust-lang/rustfmt@v1.1.2
  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --all --manifest-path=./Cargo.toml -- -D warnings
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions-rust-lang/setup-rust-toolchain@v2.0.1

      - name: Run tests
        run: cargo test -p impit

      - name: Run tests with HTTP/3
        run: cargo test -p impit --features http3
